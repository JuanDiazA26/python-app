<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c63ff;
            --text: #25243a;
            --success: #198754;
        }

        body {
            min-height: 100vh;
            padding: 1rem;
            background: linear-gradient(135deg, #6c63ff, #9b8cff);
            font-family: "Inter", sans-serif;
            color: var(--text);
        }

        .converter-card {
            width: min(100%, 430px);
            border: 0;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.96);
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .result-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--success);
        }

        @media (max-width: 576px) {
            .converter-card {
                padding: 1.25rem !important;
            }

            .currency-row {
                flex-direction: column;
                gap: 0.75rem;
            }

            .currency-arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4 converter-card">
        <h2 class="text-center mb-4">💱 Conversor de Divisas</h2>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Cantidad</label>
                <input type="number" step="0.01" name="amount" 
                       class="form-control form-control-lg" 
                       placeholder="Introduce cantidad" required>
            </div>

            <div class="row mb-3 currency-row">
                <div class="col">
                    <select name="from_currency" class="form-select">
                        <option value="EUR">EUR €</option>
                        <option value="USD">USD $</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
                <div class="col text-center align-self-center currency-arrow">
                    →
                </div>
                <div class="col">
                    <select name="to_currency" class="form-select">
                        <option value="USD">USD $</option>
                        <option value="EUR">EUR €</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    Convertir
                </button>
            </div>
        </form>

        {% if result is not none %}
            <div class="mt-4 text-center result-box">
                {{ result }}
            </div>
        {% endif %}
    </div>

</body>
</html>
