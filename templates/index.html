<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c63ff;
            --text: #25243a;
            --success: #198754;
        }

        body {
            min-height: 100vh;
            padding: 1rem;
            background: linear-gradient(135deg, #6c63ff, #9b8cff);
            font-family: "Inter", sans-serif;
            color: var(--text);
        }

        .converter-card {
            width: min(100%, 430px);
            border: 0;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.96);
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .result-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--success);
        }

        @media (max-width: 576px) {
            .converter-card {
                padding: 1.25rem !important;
            }

            .currency-row {
                flex-direction: column;
                gap: 0.75rem;
            }

            .currency-arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg glass-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <span class="brand-logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 16V4m0 0L3 8m4-4l4 4"/>
                        <path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
                    </svg>
                </span>
                <span>FX<span class="text-primary-emphasis" style="color: #60a5fa !important;">Convert</span></span>
            </a>

            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Menu">
                <i class="bi bi-list fs-2 text-white"></i>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="bi bi-house-door me-1"></i> Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-graph-up-arrow me-1"></i> Tipos de Cambio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-clock-history me-1"></i> Histórico</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <span class="badge bg-light text-dark px-3 py-2 rounded-pill fw-semibold">
                            <i class="bi bi-broadcast text-success me-1"></i> Tasas en vivo
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="card p-4 p-md-5 converter-card">
            
            <div class="card-header-custom">
                <h2>Conversión Instantánea</h2>
                <p>Calcula el valor en tiempo real entre monedas globales</p>
            </div>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label" for="amountInput">Importe a convertir</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted" style="border-radius: 12px 0 0 12px;">
                            <i class="bi bi-cash"></i>
                        </span>
                        <input type="number" step="0.01" name="amount" id="amountInput"
                               class="form-control form-control-lg border-start-0 ps-1" 
                               placeholder="0.00" required>
                    </div>
                </div>

                <div class="row align-items-center g-2 mb-4">
                    <div class="col">
                        <label class="form-label">De</label>
                        <select name="from_currency" class="form-select">
                            <option value="EUR">EUR (€)</option>
                            <option value="USD">USD ($)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="JPY">JPY (¥)</option>
                        </select>
                    </div>

                    <div class="col-auto text-center pt-4">
                        <div class="exchange-divider" title="Hacia">
                            <i class="bi bi-arrow-left-right"></i>
                        </div>
                    </div>

                    <div class="col">
                        <label class="form-label">A</label>
                        <select name="to_currency" class="form-select">
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="JPY">JPY (¥)</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-convert text-white">
                        <i class="bi bi-arrow-repeat me-1"></i> Convertir Divisas
                    </button>
                </div>
            </form>

            {% if result is not none %}
                <div class="result-container">
                    <div class="result-label">Resultado de la conversión</div>
                    <div class="result-box">
                        {{ result }}
                    </div>
                </div>
            {% endif %}

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
